  <!-- ============ FORMULARIO DE LOGIN ============ -->
  <div class="login-wrap">
    <form class="login-card" onsubmit="event.preventDefault(); alert('Función de inicio de sesión pendiente de conectar con el servidor.');">
      <h1>🔐 Iniciar Sesión</h1>
      <label for="usuario">Usuario o correo</label>
      <input type="text" id="usuario" name="usuario" placeholder="ejemplo@subachoque.gov.co" required>
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" placeholder="••••••••" required>
      <button type="submit">INGRESAR</button>
      <p style="text-align:center; margin-top:16px; font-size:13px;">
        <a href="#" style="color:var(--azul);">¿Olvidaste tu contraseña?</a>
      </p>
    </form>
