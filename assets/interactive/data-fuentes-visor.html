<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Subachoque · Capítulos del territorio</title>
  <link rel="stylesheet" href="data-fuentes-visor.css">
  <script defer src="data-fuentes-visor.js"></script>
</head>
<body>
  <button id="chapterToggle" class="chapter-toggle" aria-label="Abrir capítulos" aria-expanded="false" aria-controls="chapters" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <nav id="chapters" aria-label="Capítulos del territorio" hidden inert>
    <h2>Capítulos del<br>territorio</h2>
    <div id="chapterList"></div>
    <p class="place">SUBACHOQUE<br><small>CUNDINAMARCA</small></p>
  </nav>
  <main id="main">
    <div class="canvas" id="canvas" aria-busy="true">
      <img id="chapterImage" alt="" hidden>
      <div id="hotspots"></div>
      <p id="loading" role="status">Cargando visual territorial…</p>
    </div>
    <div class="chapter-steps"><button id="previous" aria-label="Capítulo anterior" type="button">←</button><span id="currentChapter" aria-live="polite"></span><button id="next" aria-label="Capítulo siguiente" type="button">→</button></div>
  </main>
  <dialog id="detail" aria-labelledby="detailTitle">
    <button id="detailClose" aria-label="Cerrar detalle" type="button">×</button>
    <small id="detailChapter"></small>
    <h2 id="detailTitle"></h2>
    <p id="detailText"></p>
    <dl><div><dt>Unidad / lectura</dt><dd id="detailUnit"></dd></div><div><dt>Estado de los valores</dt><dd id="detailStatus"></dd></div></dl>
    <a id="detailSource" target="_blank" rel="noopener noreferrer">Consultar fuente oficial ↗</a>
  </dialog>
</body>
</html>
