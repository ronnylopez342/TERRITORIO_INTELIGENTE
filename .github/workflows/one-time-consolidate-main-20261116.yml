name: Consolidar ramas en main - ejecucion unica

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-consolidate-main-20261116.yml

jobs:
  consolidate:
    if: github.repository == 'ronnylopez342/TERRITORIO_INTELIGENTE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Archivar cambios unicos y eliminar ramas secundarias
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$repo" = 'ronnylopez342/TERRITORIO_INTELIGENTE'
          main_sha="$(gh api "repos/$repo/branches/main" --jq '.commit.sha')"
          echo "Rama principal: $main_sha"
          mapfile -t entries < <(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[] | [.name, .commit.sha, (.protected | tostring)] | @tsv')
          test "${#entries[@]}" -gt 1
          removed=0
          archived=0
          skipped=0
          for entry in "${entries[@]}"; do
            IFS=$'\t' read -r branch original_sha protected <<< "$entry"
            if [[ "$branch" == main ]]; then continue; fi
            if [[ "$protected" == true ]]; then
              echo "PROTEGIDA: $branch (se conserva)"
              ((skipped+=1))
              continue
            fi
            current_sha="$(gh api "repos/$repo/branches/$branch" --jq '.commit.sha' 2>/dev/null || true)"
            if [[ "$current_sha" != "$original_sha" ]]; then
              echo "CAMBIADA: $branch (se conserva por seguridad)"
              ((skipped+=1))
              continue
            fi
            ahead="$(gh api "repos/$repo/compare/$main_sha...$original_sha" --jq '.ahead_by' 2>/dev/null || true)"
            if [[ ! "$ahead" =~ ^[0-9]+$ ]]; then
              echo "COMPARACION FALLIDA: $branch (se conserva)"
              ((skipped+=1))
              continue
            fi
            if (( ahead > 0 )); then
              backup="refs/tags/archivo-20261116/$branch"
              if ! gh api --method POST "repos/$repo/git/refs" -f "ref=$backup" -f "sha=$original_sha" --silent; then
                echo "NO ARCHIVADA: $branch (se conserva)"
                ((skipped+=1))
                continue
              fi
              echo "ARCHIVADA: $branch -> $backup"
              ((archived+=1))
            fi
            confirmed_sha="$(gh api "repos/$repo/branches/$branch" --jq '.commit.sha' 2>/dev/null || true)"
            if [[ "$confirmed_sha" != "$original_sha" ]]; then
              echo "CAMBIADA DURANTE LIMPIEZA: $branch (se conserva)"
              ((skipped+=1))
              continue
            fi
            if gh api --method DELETE "repos/$repo/git/refs/heads/$branch" --silent; then
              echo "ELIMINADA: $branch"
              ((removed+=1))
            else
              echo "ELIMINACION FALLIDA: $branch"
              ((skipped+=1))
            fi
          done
          echo "Resumen: eliminadas=$removed, respaldadas_como_etiquetas=$archived, omitidas=$skipped"
          mapfile -t remaining < <(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name')
          printf 'Ramas restantes: %s\n' "${remaining[*]}"
          if [[ ${#remaining[@]} -ne 1 || "${remaining[0]}" != main ]]; then
            echo 'La limpieza no pudo completar la meta de una sola rama; revisar los motivos indicados.'
            exit 1
          fi
