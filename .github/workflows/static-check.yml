name: Validacion actual de Territorio Inteligente

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar estructura vigente y recursos
        run: |
          python scripts/verify_static.py
          python scripts/verify_structure.py
      - name: Verificar sintaxis JavaScript de todos los modulos
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verificar importaciones Data
        run: node scripts/test_data_core.cjs
      - name: Verificar Unidad de Cumplimiento 4.2 con datos reales
        run: node scripts/test_uc42.cjs
      - name: Verificar Plan Estadistico integrado en 2.1
        run: node scripts/test_plan_estadistico.cjs
      - name: Verificar vistas 2.1-2.4 y sus fuentes
        run: node scripts/test_current_modules.cjs
      - name: Verificar matriz cuatrienal de Asi cumplimos 3.2
        run: node scripts/test_asi_cumplimos32.cjs
      - name: Verificar Plan de Acción 2026 tercer trimestre sin doble totalización
        run: node scripts/test_plan_accion_2026_3t.cjs
      - name: Auditar 227 enlaces documentales, 160 metadatos y 157 faltantes
        run: node scripts/test_plan33_evidencias_2026_3t.cjs
      - name: Proteger fuentes originales y verificar registro editorial M2
        run: |
          node scripts/verify_critical_assets.cjs
          node scripts/verify_editor_registry.cjs
      # Las pruebas antiguas Dane/Memoria/Encuesta/Publicaciones se conservan
      # como evidencia para evaluar su recuperacion. Exigen pantallas 2.3-2.6
      # retiradas y no deben confundirse con pruebas de las cuatro actuales.
      - name: Preparar navegador para prueba actual
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium --with-deps
      - name: Smoke de las cuatro vistas Data actuales
        run: node scripts/smoke_current_modules.cjs
      - name: Smoke de Plan de Accion 3.3 y Cumplimiento 4.2
        run: node scripts/smoke_plan_cumplimiento.cjs
      - name: Verificar barra completa y contenido de las diez pestañas de Plan 3.3
        run: node scripts/smoke_plan33_full_tabs.cjs
      - name: Smoke interactivo de Asi cumplimos 3.2
        run: node scripts/smoke_asi_cumplimos32.cjs
      - name: Conservar capturas de Asi cumplimos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-asi-cumplimos-32
          path: |
            screenshots/asi32-inicio-desktop.png
            screenshots/asi32-secretaria-desktop.png
            screenshots/asi32-consolidado-desktop.png
            screenshots/asi32-consolidado-mobile.png
            screenshots/asi32-inicio-mobile.png
            screenshots/asi32-finanzas-desktop.png
            screenshots/asi32-plan-desktop.png
            screenshots/asi32-lineas-desktop.png
            screenshots/asi32-metas-entidad-desktop.png
            screenshots/asi32-ejecucion-entidad-desktop.png
            screenshots/asi32-metas-entidad-mobile.png
            screenshots/asi32-cobertura-excel-desktop.png
            screenshots/asi32-poai-desktop.png
            screenshots/asi32-fuentes-desktop.png
            screenshots/asi32-fuentes-mobile.png
            screenshots/asi32-metodologia-desktop.png
            screenshots/asi32-resultados-desktop.png
            screenshots/asi32-resultados-mobile.png
            screenshots/asi32-publicaciones-desktop.png
            screenshots/asi32-fuentes-pendientes-desktop.png
          if-no-files-found: warn
      - name: Conservar evidencia visual del mapa y Planes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-visual-plan33-cumplimiento42
          path: |
            screenshots/auditoria-plan33-2025.png
            screenshots/auditoria-plan33-2026-3t.png
            screenshots/auditoria-plan33-movil.png
            screenshots/auditoria-plan33-tabs-2026-desktop.png
            screenshots/auditoria-plan33-tabs-2026-mobile.png
            screenshots/auditoria-plan33-soportes-2026-3t.png
            screenshots/auditoria-plan33-soportes-faltantes-2026-3t.png
            screenshots/auditoria-plan33-contratos-2026-3t.png
            screenshots/auditoria-cumplimiento42-mapa.png
            screenshots/auditoria-cumplimiento42-movil.png
          if-no-files-found: warn
