name: Static check

on:
  push:
    branches:
      - production/v2.6-canonical
      - fix/data-imports-20261009
      - delivery/01-structure
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify static structure
        run: |
          python scripts/verify_static.py
          python scripts/verify_structure.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify data parsing
        run: node scripts/test_data_core.cjs
      - name: Verify Plan Estadistico 2.2
        run: node scripts/test_plan_estadistico.cjs
      - name: Verify DANE Subachoque 2.3
        run: node scripts/test_dane_subachoque.cjs
      - name: Verify Memoria de la Alcaldia
        run: node scripts/test_memoria_alcaldia.cjs
      - name: Verify Encuesta Municipal 2.4
        run: node scripts/test_encuesta_municipal.cjs
      - name: Prepare browser smoke
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium --with-deps
      - name: Smoke test DANE UI
        run: node scripts/smoke_dane_subachoque.cjs
      - name: Smoke test Memoria de la Alcaldia
        run: node scripts/smoke_memoria_alcaldia.cjs
      - name: Smoke test Encuesta Municipal 2.4
        run: node scripts/smoke_encuesta_municipal.cjs
      - name: Upload DANE UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dane23-browser-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
