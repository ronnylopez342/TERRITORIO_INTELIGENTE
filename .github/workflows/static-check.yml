name: Static check

on:
  push:
    branches:
      - production/v2.6-canonical
      - fix/data-imports-20261009
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify static structure
        run: python scripts/verify_static.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify data parsing
        run: node scripts/test_data_core.cjs
